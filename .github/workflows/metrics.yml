name: 📊 Generate Metrics

on:
  schedule:
    # Once a day, off-peak minute
    - cron: "23 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # Main stats card -> github-metrics.svg
      - name: Overview metrics
        uses: lowlighter/metrics@v3.34
        with:
          # A classic Personal Access Token (scope: repo, read:org for private/org data;
          # public_repo alone is enough for a public-only card). Add it in
          # Settings > Secrets and variables > Actions as METRICS_TOKEN.
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Africa/Cairo
          config_order: base.header, base.activity, base.community, base.repositories, isocalendar, languages, stars
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_stars: yes
          plugin_stars_limit: 3

      # Commit both SVGs to the repo
      - name: Commit & push metrics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A github-metrics.svg
          git diff --staged --quiet || git commit -m "chore: update metrics [skip ci]"
          git push
